# Tests must never touch the developer's real database.
#
# application.yml (the default profile) points at the local dev database
# (DB_NAME, default demie_portal), and every integration test opens with a
# TRUNCATE. A @SpringBootTest that forgets @ActiveProfiles("test") therefore
# wipes local accounts and projects — which is exactly what happened when
# DerivativeWorkerTest ran without it. Activating the profile here means the
# test database (portal_test, see application-test.yml) is the default for the
# whole test classpath, whatever a single test class remembers to declare.
spring:
  profiles:
    active: test
