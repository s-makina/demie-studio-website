server:
  port: ${PORT:8080}

spring:
  # No active profile means "a developer machine": application-local.yml then
  # imports infra/.env so the API configures itself with no export step. Tests
  # activate the test profile and deployments set their own, so neither is
  # affected. See docs/superpowers/specs/2026-10-17-env-file-self-configuration-design.md
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demie_portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Forcode123!}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

logging:
  level:
    com.demie.portal: info
    org.flywaydb: info
