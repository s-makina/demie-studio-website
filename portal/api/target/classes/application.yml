server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demie_portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Forcode123!}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

logging:
  level:
    com.demie.portal: info
    org.flywaydb: info
