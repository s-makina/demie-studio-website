server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

  # Skeleton; real values supplied by env before boot.
  # S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY are wired in S3Config once added.

logging:
  level:
    com.demie.portal: info
    org.flywaydb: info
